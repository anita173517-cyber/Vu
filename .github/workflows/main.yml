name: StreamX Media3 Pro v18.0 Next-Gen Ultra Extreme - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: streamx-v18-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Find & Extract Uploaded ZIP Project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            echo "Project already extracted at repository root."
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print | sort -V | tail -n 1)"
          if [[ -n "${ZIP_FILE}" ]]; then
            echo "Found uploaded ZIP archive: ${ZIP_FILE}"
            EXTRACT_DIR="${RUNNER_TEMP}/streamx_extracted"
            rm -rf "${EXTRACT_DIR}"
            mkdir -p "${EXTRACT_DIR}"
            unzip -q -o "${ZIP_FILE}" -d "${EXTRACT_DIR}"

            SETTINGS_FILE="$(find "${EXTRACT_DIR}" -type f -name 'settings.gradle.kts' -print -quit)"
            if [[ -z "${SETTINGS_FILE}" ]]; then
              echo "::error::Uploaded ZIP ke andar settings.gradle.kts nahi mila!"
              exit 1
            fi

            PROJECT_DIR="$(dirname "${SETTINGS_FILE}")"
            echo "Copying project from ${PROJECT_DIR} to workspace root..."
            cp -a "${PROJECT_DIR}/." "${GITHUB_WORKSPACE}/"
            chmod +x gradlew 2>/dev/null || true
            test -f "settings.gradle.kts"
            test -f "app/build.gradle.kts"
            echo "ZIP extracted successfully!"
            exit 0
          fi

          SUB_SETTINGS="$(find . -maxdepth 3 -type f -name 'settings.gradle.kts' -print -quit)"
          if [[ -n "${SUB_SETTINGS}" ]]; then
            PROJECT_DIR="$(dirname "${SUB_SETTINGS}")"
            cp -a "${PROJECT_DIR}/." "${GITHUB_WORKSPACE}/"
            test -f "settings.gradle.kts"
            test -f "app/build.gradle.kts"
            exit 0
          fi

          echo "::error::Repository mein koi .zip file ya Android project nahi mila! Pehle StreamX_Media3_Pro_v18.0_Next_Gen_Ultra_Extreme_Edition.zip upload karein."
          exit 1

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configure Preinstalled Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "sdk.dir=${SDK_ROOT}" > local.properties

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 5. Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 6. Verify Resources & Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "scripts/verify_project.py" ]]; then
            python3 scripts/verify_project.py
          fi
          gradle --no-daemon --no-configuration-cache testDebugUnitTest --stacktrace

      - name: 7. Build Installable 512MB Release & Debug APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache assembleRelease assembleDebug --stacktrace

          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 2 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          if [[ -z "${RELEASE_APK}" ]]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          fi
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 2 -type f -name '*.apk' -print -quit)"

          test -s "${RELEASE_APK}"
          unzip -t "${RELEASE_APK}" >/dev/null

          mkdir -p apk_out
          cp "${RELEASE_APK}" apk_out/StreamX-Media3-Pro-v18.0-Next-Gen-Ultra-Extreme-512MB.apk
          if [[ -n "${DEBUG_APK}" && -s "${DEBUG_APK}" ]]; then
            unzip -t "${DEBUG_APK}" >/dev/null
            cp "${DEBUG_APK}" apk_out/StreamX-Media3-Pro-v18.0-Debug.apk
          fi
          ls -lh apk_out/

      - name: 8. Upload 512MB Release APK (Install This on TV)
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Media3-Pro-v18.0-Next-Gen-Ultra-Extreme-Release
          path: apk_out/StreamX-Media3-Pro-v18.0-Next-Gen-Ultra-Extreme-512MB.apk
          if-no-files-found: error
          retention-days: 14

      - name: 9. Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamX-Media3-Pro-v18.0-Debug-APK
          path: apk_out/StreamX-Media3-Pro-v18.0-Debug.apk
          if-no-files-found: warn
          retention-days: 14
